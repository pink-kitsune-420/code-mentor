[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "code-mentor"
version = "0.1.0"
description = "Beginner-to-expert visual Python code tutor, live execution stepper, and interactive lesson studio."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pink-kitsune-420 and Code Mentor contributors" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
code-mentor = "mentor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/mentor"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
